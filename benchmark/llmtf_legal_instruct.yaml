# Runtime defaults match llmtf_benchmark_instruct_fast.yaml.
# Batch size is selected by the runner, as in the main benchmark.
model:
  model_kind: hybrid
  enable_thinking: false
  assistant_prefill_policy: best_effort

defaults:
  generation:
    temperature: 0.3
    repetition_penalty: 1.0
    presence_penalty: 0.0
    num_return_sequences: 1

tasks:
  - name: law_mc
    datasets:
      - shlepa/lawmc
    few_shot_count: 0
    generation:
      temperature: 0.0
      repetition_penalty: 1.0
      presence_penalty: 0.0
      num_return_sequences: 1

  - name: legalbench_ru
    datasets:
      - legalbench_ru/closed
      - legalbench_ru/grounded
      - legalbench_ru/distractor
      - legalbench_ru/temporal
    few_shot_count: 0
    name_suffix: 0shot
    max_sample_per_dataset: 200

  - name: rutar
    datasets:
      - rutar/closed
    few_shot_count: 0
    name_suffix: 0shot

  - name: rulegalner_manual
    datasets:
      - rulegalner_manual/legal
    few_shot_count: 0
    name_suffix: 0shot

  - name: rulaw_proofbench
    datasets:
      - rulaw_proofbench/closed
      - rulaw_proofbench/grounded
      - rulaw_proofbench/mcq_closed
      - rulaw_proofbench/mcq_grounded
    few_shot_count: 0
    name_suffix: 0shot
    generation:
      temperature: 0.0
