# Runtime defaults match llmtf_benchmark_instruct_fast.yaml.
# Batch size is selected by the runner, as in the main benchmark.
model:
  model_kind: hybrid
  enable_thinking: false
  assistant_prefill_policy: best_effort

defaults:
  generation:
    temperature: 0.3
    repetition_penalty: 1.0
    presence_penalty: 0.0
    num_return_sequences: 1

tasks:
  - name: law_mc
    datasets:
      - shlepa/lawmc
    few_shot_count: 0
    generation:
      temperature: 0.0
      repetition_penalty: 1.0
      presence_penalty: 0.0
      num_return_sequences: 1

  - name: legalbench_ru_closed
    datasets:
      - legalbench_ru/closed
    few_shot_count: 0
    name_suffix: 0shot

  - name: legalbench_ru_grounded
    datasets:
      - legalbench_ru/grounded
    few_shot_count: 0
    name_suffix: 0shot

  - name: rulaw_proofbench_closed
    datasets:
      - rulaw_proofbench/closed
    few_shot_count: 0
    name_suffix: 0shot
    generation:
      temperature: 0.0

  - name: rulaw_proofbench_grounded
    datasets:
      - rulaw_proofbench/grounded
    few_shot_count: 0
    name_suffix: 0shot
    generation:
      temperature: 0.0

  - name: rulaw_proofbench_mcq_closed
    datasets:
      - rulaw_proofbench/mcq_closed
    few_shot_count: 0
    name_suffix: 0shot
    generation:
      temperature: 0.0

  - name: rulaw_proofbench_mcq_grounded
    datasets:
      - rulaw_proofbench/mcq_grounded
    few_shot_count: 0
    name_suffix: 0shot
    generation:
      temperature: 0.0
